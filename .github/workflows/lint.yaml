name: lint

on:
  workflow_dispatch:
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run fmt
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            ghcr.io/gw0/docker-claude-code:main \
            make fmt

      - name: Error on uncommitted changes
        run: git diff --exit-code
